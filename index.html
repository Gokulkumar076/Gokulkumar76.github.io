<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gokul Kumar — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#06060a; }
    * { cursor: none !important; }
    #three-canvas { position:fixed; inset:0; width:100%; height:100%; z-index:0; }
    #bgc { position:fixed; inset:0; width:100%; height:100%; z-index:1; pointer-events:none; }
    #jc  { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:5; }
    #scanlines {
      position:fixed; inset:0; z-index:6; pointer-events:none;
      background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.025) 2px,rgba(0,0,0,.025) 4px);
    }
    #vignette {
      position:fixed; inset:0; z-index:7; pointer-events:none;
      background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.7) 100%);
    }
    #welcome {
      position:fixed; inset:0;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      text-align:center; padding:40px 20px;
      z-index:10;
    }
    .item { opacity:0; transform:translateY(24px); transition:opacity .75s cubic-bezier(.16,1,.3,1), transform .75s cubic-bezier(.16,1,.3,1); }
    .item.show { opacity:1; transform:translateY(0); }
    .glass-badge { display:inline-flex; align-items:center; gap:9px; padding:9px 22px; background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.11); border-radius:999px; backdrop-filter:blur(16px); margin-bottom:28px; }
    .pulse-dot { width:7px; height:7px; border-radius:50%; background:#f5a623; animation:pulseRing 1.8s ease-in-out infinite; }
    @keyframes pulseRing { 0%{box-shadow:0 0 0 0 rgba(245,166,35,.6);} 70%{box-shadow:0 0 0 8px rgba(245,166,35,0);} 100%{box-shadow:0 0 0 0 rgba(245,166,35,0);} }
    .glass-badge span { font-family:'Manrope',sans-serif; font-size:12px; color:#a0a0b8; letter-spacing:.07em; }
    .welcome-label { font-family:'Manrope',sans-serif; font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:#f5a623; font-weight:700; margin-bottom:12px; text-shadow:0 0 16px rgba(245,166,35,.55); }
    .headline-wrap { display:flex; flex-direction:column; align-items:center; gap:2px; margin-bottom:10px; }
    .headline-top { font-family:'Manrope',sans-serif; font-size:clamp(14px,2vw,18px); font-weight:500; color:rgba(240,237,230,.45); letter-spacing:.18em; text-transform:uppercase; }
    .big-name { font-family:'Syne',sans-serif; font-size:clamp(58px,10vw,104px); font-weight:800; line-height:.92; letter-spacing:-.045em; color:#f0ede6; position:relative; }
    .big-name .line2 { display:block; color:#f5a623; text-shadow:0 0 55px rgba(245,166,35,.38); }
    .headline-sub { font-family:'Manrope',sans-serif; font-size:clamp(13px,1.8vw,16px); font-weight:500; color:rgba(240,237,230,.3); letter-spacing:.12em; text-transform:uppercase; }
    .big-name.glitch .line1 { animation:gl1 .5s steps(1) forwards; }
    .big-name.glitch .line2 { animation:gl2 .5s steps(1) forwards; }
    @keyframes gl1 { 0%{transform:translate(0);} 20%{transform:translate(-3px,1px);clip-path:inset(20% 0 55% 0);} 40%{transform:translate(3px,-1px);} 60%{transform:translate(-2px,0);clip-path:inset(55% 0 25% 0);} 80%{transform:translate(0);clip-path:none;} 100%{transform:translate(0);} }
    @keyframes gl2 { 0%{transform:translate(0);filter:none;} 25%{transform:translate(4px,0);filter:hue-rotate(80deg);} 50%{transform:translate(-3px,1px);filter:none;} 75%{transform:translate(2px,0);filter:hue-rotate(-30deg);} 100%{transform:translate(0);filter:none;} }
    .typewriter-wrap { font-family:'Manrope',sans-serif; font-size:14px; color:rgba(160,160,184,.7); letter-spacing:.04em; margin-bottom:30px; min-height:22px; }
    .typewriter-wrap .cursor-blink { display:inline-block; width:2px; height:14px; background:#f5a623; margin-left:2px; vertical-align:middle; animation:blink .8s steps(1) infinite; }
    @keyframes blink { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
    .divider { width:1px; height:36px; background:linear-gradient(to bottom,transparent,rgba(245,166,35,.4),transparent); margin:6px auto 22px; }
    .loader-block { display:flex; flex-direction:column; align-items:center; gap:10px; width:240px; margin-bottom:22px; }
    .loader-track { width:100%; height:2px; background:rgba(255,255,255,.07); border-radius:999px; overflow:hidden; position:relative; }
    .loader-track::before { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent); animation:shimmer 1.8s linear infinite; }
    @keyframes shimmer { from{transform:translateX(-100%);} to{transform:translateX(400%);} }
    .loader-bar { height:100%; width:0; border-radius:999px; background:linear-gradient(90deg,rgba(245,166,35,.5),#f5a623,#ffdb80); box-shadow:0 0 12px rgba(245,166,35,.7); transition:width 1.5s cubic-bezier(.16,1,.3,1); position:relative; z-index:1; }
    .loader-meta { display:flex; justify-content:space-between; width:100%; }
    .loader-label { font-family:'Manrope',sans-serif; font-size:10px; color:rgba(160,160,184,.45); letter-spacing:.1em; text-transform:uppercase; }
    .loader-pct { font-family:'Syne',sans-serif; font-size:11px; font-weight:700; color:rgba(245,166,35,.7); letter-spacing:.12em; }
    .enter-wrap { position:relative; }
    .enter-wrap::before, .enter-wrap::after { content:''; position:absolute; inset:-1px; border-radius:999px; border:1px solid rgba(245,166,35,0); transition:all .4s ease; pointer-events:none; }
    .enter-wrap:hover::before { inset:-7px; border-color:rgba(245,166,35,.2); }
    .enter-wrap:hover::after  { inset:-14px; border-color:rgba(245,166,35,.07); }
    #enterBtn {
      position:relative; overflow:hidden; padding:15px 52px; border-radius:999px;
      border:1px solid rgba(255,255,255,.22);
      background:linear-gradient(135deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,.06) 40%,rgba(200,200,220,.08) 100%);
      backdrop-filter:blur(22px) saturate(1.4); -webkit-backdrop-filter:blur(22px) saturate(1.4);
      box-shadow:inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.22),0 4px 28px rgba(0,0,0,.38),0 0 0 1px rgba(255,255,255,.06);
      color:rgba(240,237,230,.9); font-family:'Syne',sans-serif; font-size:14px; font-weight:700; letter-spacing:.08em;
      cursor:pointer; transition:transform .26s cubic-bezier(.34,1.2,.64,1),box-shadow .26s ease,border-color .26s ease,color .26s ease;
      pointer-events:none; filter:brightness(.42) saturate(.35);
    }
    #enterBtn::before { content:''; position:absolute; top:0; left:-65%; width:40%; height:100%; background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent); transform:skewX(-20deg); transition:left .6s ease; pointer-events:none; }
    #enterBtn:hover::before { left:135%; }
    .btn-arrow { display:inline-block; margin-left:10px; transition:transform .25s ease; }
    #enterBtn:hover .btn-arrow { transform:translateX(5px); }
    #enterBtn.ready { pointer-events:all; filter:none; transition:transform .26s cubic-bezier(.34,1.2,.64,1),box-shadow .26s ease,border-color .26s ease,color .26s ease,filter .6s ease; }
    #enterBtn.ready:hover { transform:translateY(-4px) scale(1.04); border-color:rgba(245,166,35,.5); color:#f5a623; box-shadow:inset 0 1.5px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(0,0,0,.22),0 0 32px rgba(245,166,35,.28),0 12px 36px rgba(0,0,0,.45),0 0 0 1px rgba(245,166,35,.14); }
    #enterBtn.ready:active { transform:scale(.97); }
    .dots-row { display:flex; gap:8px; margin-top:22px; }
    .dot { width:6px; height:6px; border-radius:50%; background:rgba(245,166,35,.18); transition:background .3s,box-shadow .3s; }
    .dot.active { background:#f5a623; box-shadow:0 0 8px rgba(245,166,35,.65); }

    /* SHATTER CANVAS — sits on top of everything */
    #shatter-canvas {
      position:fixed; inset:0; width:100%; height:100%;
      z-index:999999; pointer-events:none; opacity:0;
      background: transparent;
    }
    #shatter-canvas.active { pointer-events:all; }

    @media(max-width:600px){ .big-name{font-size:clamp(44px,13vw,66px);} .headline-top,.headline-sub{font-size:11px;} }
  </style>
</head>
<body>

<canvas id="shatter-canvas"></canvas>
<canvas id="three-canvas"></canvas>
<canvas id="bgc"></canvas>
<canvas id="jc"></canvas>
<div id="scanlines"></div>
<div id="vignette"></div>

<div id="welcome">
  <div class="glass-badge item" id="e1"><div class="pulse-dot"></div><span>Portfolio · 2026</span></div>
  <p class="welcome-label item" id="e2">Welcome to</p>
  <div class="headline-wrap item" id="e3">
    <span class="headline-top">the portfolio of</span>
    <h1 class="big-name" id="nameEl"><span class="line1">Gokul</span><span class="line2">Kumar</span></h1>
    <span class="headline-sub">Computer Science · Developer</span>
  </div>
  <div class="typewriter-wrap item" id="e4"><span id="tw-text"></span><span class="cursor-blink"></span></div>
  <div class="divider item" id="e5"></div>
  <div class="loader-block item" id="e6">
    <div class="loader-track"><div class="loader-bar" id="lbar"></div></div>
    <div class="loader-meta"><span class="loader-label">Loading</span><span class="loader-pct" id="lpct">0%</span></div>
  </div>
  <div class="enter-wrap item" id="e7">
    <button id="enterBtn">Enter Portfolio <span class="btn-arrow">→</span></button>
  </div>
  <div class="dots-row item" id="e8">
    <div class="dot active"></div><div class="dot"></div><div class="dot"></div>
  </div>
</div>

<!-- THREE.JS BG -->
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const canvas=document.getElementById('three-canvas');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x000000,0);
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x06060a,.018);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,200);
camera.position.set(0,0,44);
const PC=innerWidth<600?700:1600;
const pos=new Float32Array(PC*3),col=new Float32Array(PC*3);
const baseC=new THREE.Color(0xf5a623),dimC=new THREE.Color(0x5a2a08);
for(let i=0;i<PC;i++){pos[i*3]=(Math.random()-.5)*110;pos[i*3+1]=(Math.random()-.5)*110;pos[i*3+2]=(Math.random()-.5)*90-10;const c=dimC.clone().lerp(baseC,Math.random());col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;}
const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
pGeo.setAttribute('color',new THREE.BufferAttribute(col,3));
scene.add(new THREE.Points(pGeo,new THREE.PointsMaterial({size:.42,vertexColors:true,transparent:true,opacity:.6,depthWrite:false,blending:THREE.AdditiveBlending})));
const tM=new THREE.MeshBasicMaterial({color:0xf5a623,wireframe:true,transparent:true,opacity:.18});
const t1=new THREE.Mesh(new THREE.TorusGeometry(5,1.6,10,36),tM);t1.position.set(-16,8,-12);scene.add(t1);
const t2=new THREE.Mesh(new THREE.TorusGeometry(3.5,1.1,8,24),new THREE.MeshBasicMaterial({color:0xb060ff,wireframe:true,transparent:true,opacity:.13}));t2.position.set(18,-6,-18);scene.add(t2);
const iM=new THREE.MeshBasicMaterial({color:0xf5a623,wireframe:true,transparent:true,opacity:.2});
const i1=new THREE.Mesh(new THREE.IcosahedronGeometry(4,0),iM);i1.position.set(20,12,-20);scene.add(i1);
const i2=new THREE.Mesh(new THREE.IcosahedronGeometry(2.5,0),new THREE.MeshBasicMaterial({color:0xff7b35,wireframe:true,transparent:true,opacity:.18}));i2.position.set(-22,-10,-14);scene.add(i2);
const oc=new THREE.Mesh(new THREE.OctahedronGeometry(3,0),new THREE.MeshBasicMaterial({color:0xf5a623,wireframe:true,transparent:true,opacity:.12}));oc.position.set(0,0,-30);scene.add(oc);
const rg=new THREE.Mesh(new THREE.TorusGeometry(8,.5,4,64),new THREE.MeshBasicMaterial({color:0xf5a623,transparent:true,opacity:.06}));rg.rotation.x=Math.PI/3;scene.add(rg);
let mX=0,mY=0;
window.addEventListener('mousemove',e=>{mX=(e.clientX/innerWidth)*2-1;mY=(e.clientY/innerHeight)*2-1;});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const clk=new THREE.Clock();
(function animate(){
  requestAnimationFrame(animate);
  const d=clk.getDelta(),e=clk.elapsedTime;
  t1.rotation.x+=d*.22;t1.rotation.y+=d*.14;t1.position.y=8+Math.sin(e*.4)*1.5;
  t2.rotation.x+=d*.18;t2.rotation.z+=d*.20;t2.position.y=-6+Math.sin(e*.35+1)*1.2;
  i1.rotation.x+=d*.12;i1.rotation.y+=d*.18;i1.position.y=12+Math.sin(e*.3+.5)*1.8;
  i2.rotation.y+=d*.20;i2.rotation.z+=d*.10;i2.position.y=-10+Math.sin(e*.45+2)*1.4;
  oc.rotation.x+=d*.08;oc.rotation.y+=d*.12;rg.rotation.z+=d*.06;
  scene.children[0].rotation.y+=d*.022;scene.children[0].rotation.x+=d*.005;
  camera.position.x+=(mX*4-camera.position.x)*.032;
  camera.position.y+=(-mY*4-camera.position.y)*.032;
  camera.lookAt(0,0,0);
  renderer.render(scene,camera);
})();
</script>

<!-- 2D OVERLAY + CURSOR -->
<script>
(function(){
  const bgc=document.getElementById('bgc'),jc=document.getElementById('jc');
  const bx=bgc.getContext('2d'),jx=jc.getContext('2d');
  function resize(){bgc.width=jc.width=innerWidth;bgc.height=jc.height=innerHeight;}
  resize();window.addEventListener('resize',resize);
  const W=()=>bgc.width,H=()=>bgc.height;
  const PC=innerWidth<600?120:220;
  const pts=Array.from({length:PC},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.3+.2,vx:(Math.random()-.5)*.15,vy:(Math.random()-.5)*.15,alpha:Math.random()*.4+.08,hue:Math.random()>.65?'245,166,35':'130,65,240'}));
  function drawAurora(t){
    for(let w=0;w<3;w++){
      const yb=H()*(0.22+w*.28);bx.beginPath();
      for(let x=0;x<=W();x+=4){const y=yb+Math.sin(x*.007+t*(.28+w*.09)+w)*40+Math.sin(x*.019-t*.5)*14;x===0?bx.moveTo(x,y):bx.lineTo(x,y);}
      bx.strokeStyle=`rgba(${ ['245,166,35','160,55,255','245,100,35'][w]},${ [.025,.018,.015][w]})`;bx.lineWidth=55;bx.stroke();
    }
  }
  let mx=-500,my=-500;
  const TRAIL=18,trail=Array.from({length:TRAIL},()=>({x:-500,y:-500}));
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
  document.addEventListener('mouseleave',()=>{mx=-500;my=-500;});
  let t=0;
  (function frame(){
    requestAnimationFrame(frame);t+=.011;bx.clearRect(0,0,W(),H());drawAurora(t);
    pts.forEach(p=>{const dx=p.x-mx,dy=p.y-my,d=Math.sqrt(dx*dx+dy*dy);if(d<80&&d>0){const f=(80-d)/80*.75;p.vx+=dx/d*f;p.vy+=dy/d*f;}p.vx*=.97;p.vy*=.97;});
    for(let i=0;i<pts.length;i++){
      const p=pts[i];p.x+=p.vx;p.y+=p.vy;
      if(p.x<-10)p.x=W()+10;if(p.x>W()+10)p.x=-10;if(p.y<-10)p.y=H()+10;if(p.y>H()+10)p.y=-10;
      const pulse=.78+.22*Math.sin(t*1.4+p.x*.028);
      bx.beginPath();bx.arc(p.x,p.y,p.r*pulse,0,Math.PI*2);bx.fillStyle=`rgba(${p.hue},${p.alpha*pulse})`;bx.fill();
      for(let j=i+1;j<pts.length;j++){const q=pts[j],dx=p.x-q.x,dy=p.y-q.y,d=Math.sqrt(dx*dx+dy*dy);if(d<85){bx.beginPath();bx.moveTo(p.x,p.y);bx.lineTo(q.x,q.y);bx.strokeStyle=`rgba(245,166,35,${(1-d/85)*.06})`;bx.lineWidth=.5;bx.stroke();}}
    }
    if(mx>-400){const cg=bx.createRadialGradient(mx,my,0,mx,my,100);cg.addColorStop(0,'rgba(245,166,35,.09)');cg.addColorStop(1,'rgba(245,166,35,0)');bx.fillStyle=cg;bx.fillRect(0,0,W(),H());}
    jx.clearRect(0,0,W(),H());
    trail[0].x+=(mx-trail[0].x)*.46;trail[0].y+=(my-trail[0].y)*.46;
    for(let i=1;i<TRAIL;i++){trail[i].x+=(trail[i-1].x-trail[i].x)*.52;trail[i].y+=(trail[i-1].y-trail[i].y)*.52;}
    if(mx>-400){for(let i=TRAIL-1;i>=0;i--){const tp=1-i/TRAIL,r=.7+tp*8,op=.07+tp*.68;const tg=jx.createRadialGradient(trail[i].x,trail[i].y,0,trail[i].x,trail[i].y,r*3.2);tg.addColorStop(0,`rgba(245,166,35,${op*.85})`);tg.addColorStop(.5,`rgba(245,166,35,${op*.25})`);tg.addColorStop(1,'rgba(245,166,35,0)');jx.beginPath();jx.arc(trail[i].x,trail[i].y,r*3.2,0,Math.PI*2);jx.fillStyle=tg;jx.fill();jx.beginPath();jx.arc(trail[i].x,trail[i].y,r,0,Math.PI*2);jx.fillStyle=`rgba(255,200,60,${op})`;jx.fill();}}
  })();
})();
</script>

<!-- SEQUENCE + TYPEWRITER + LOADER + SHATTER TRANSITION -->
<script>
(function(){
  const GAP=310;
  const phrases=['Building things with code.','Turning ideas into projects.','Exploring what technology can do.'];
  let pi=0,ci=0,deleting=false;
  const twEl=document.getElementById('tw-text');
  function typeStep(){
    const phrase=phrases[pi];
    if(!deleting){ci++;twEl.textContent=phrase.slice(0,ci);if(ci===phrase.length){setTimeout(()=>{deleting=true;typeStep();},1800);return;}setTimeout(typeStep,55+Math.random()*30);}
    else{ci--;twEl.textContent=phrase.slice(0,ci);if(ci===0){deleting=false;pi=(pi+1)%phrases.length;setTimeout(typeStep,400);return;}setTimeout(typeStep,28);}
  }
  const ids=['e1','e2','e3','e4','e5','e6','e7','e8'];
  ids.forEach((id,i)=>{
    setTimeout(()=>{
      document.getElementById(id).classList.add('show');
      if(id==='e3'){setTimeout(()=>{document.getElementById('nameEl').classList.add('glitch');setTimeout(()=>document.getElementById('nameEl').classList.remove('glitch'),560);},420);}
      if(id==='e4')setTimeout(typeStep,300);
      if(id==='e6')startLoader();
    },380+i*GAP);
  });
  const dots=document.querySelectorAll('.dot');let di=0;
  setInterval(()=>{dots.forEach(d=>d.classList.remove('active'));di=(di+1)%dots.length;dots[di].classList.add('active');},1400);

  function startLoader(){
    const lbar=document.getElementById('lbar'),lpct=document.getElementById('lpct'),btn=document.getElementById('enterBtn');
    let pct=0;
    const tick=setInterval(()=>{pct=Math.min(pct+Math.floor(Math.random()*5)+2,99);lpct.textContent=pct+'%';},36);
    setTimeout(()=>{lbar.style.width='100%';},60);
    setTimeout(()=>{clearInterval(tick);lpct.textContent='100%';lbar.style.boxShadow='0 0 22px rgba(245,166,35,1)';setTimeout(()=>{lbar.style.boxShadow='0 0 12px rgba(245,166,35,.7)';},300);btn.classList.add('ready');},1580);
  }

  /* ══════════════════════════════════════════
     SHATTER TRANSITION
     — Takes a screenshot of the page via canvas,
       slices it into voronoi-ish polygons,
       flings them outward with rotation,
       then navigates immediately (no black gap)
  ══════════════════════════════════════════ */
  function runShatter(clickX, clickY, onDone) {
    const sc = document.getElementById('shatter-canvas');
    const ctx = sc.getContext('2d');
    const W = window.innerWidth;
    const H = window.innerHeight;
    sc.width = W; sc.height = H;
    sc.style.opacity = '1';
    sc.classList.add('active');

    /* --- Generate voronoi-ish seed points --- */
    const PIECES = 28;
    const seeds = [];

    /* Always include click point as a seed */
    seeds.push({x: clickX, y: clickY});

    /* Add random seeds spread across screen */
    for (let i = 1; i < PIECES; i++) {
      seeds.push({
        x: Math.random() * W,
        y: Math.random() * H
      });
    }

    /* --- Build polygon for each seed via brute-force clipping --- */
    function buildCell(seedIdx) {
      /* Start with full screen rect as polygon */
      let poly = [
        {x:0,y:0},{x:W,y:0},{x:W,y:H},{x:0,y:H}
      ];
      const si = seeds[seedIdx];
      for (let j = 0; j < seeds.length; j++) {
        if (j === seedIdx) continue;
        const sj = seeds[j];
        /* Clip polygon by perpendicular bisector of si→sj */
        const mx = (si.x + sj.x) / 2;
        const my = (si.y + sj.y) / 2;
        const nx = sj.x - si.x;
        const ny = sj.y - si.y;
        poly = clipPolygonByHalfplane(poly, mx, my, nx, ny);
        if (poly.length === 0) break;
      }
      return poly;
    }

    function clipPolygonByHalfplane(poly, mx, my, nx, ny) {
      const out = [];
      for (let i = 0; i < poly.length; i++) {
        const a = poly[i];
        const b = poly[(i+1) % poly.length];
        const da = (a.x-mx)*nx + (a.y-my)*ny;
        const db = (b.x-mx)*nx + (b.y-my)*ny;
        if (da <= 0) out.push(a);
        if ((da < 0 && db > 0) || (da > 0 && db < 0)) {
          const t = da / (da - db);
          out.push({x: a.x + t*(b.x-a.x), y: a.y + t*(b.y-a.y)});
        }
      }
      return out;
    }

    /* --- Capture current screen visually --- */
    /* We'll draw each shard as a filled amber gradient
       since we can't do cross-origin canvas capture.
       Each shard gets a unique gold/dark tone. */

    /* Build all cells */
    const cells = seeds.map((s, i) => {
      const poly = buildCell(i);
      if (poly.length < 3) return null;

      /* Centroid */
      let cx = 0, cy = 0;
      poly.forEach(p => { cx += p.x; cy += p.y; });
      cx /= poly.length; cy /= poly.length;

      /* Direction away from click */
      let dx = cx - clickX;
      let dy = cy - clickY;
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      dx /= dist; dy /= dist;

      /* Speed inversely proportional to distance from click — close pieces fly faster */
      const speed = 400 + (1 - Math.min(dist / Math.max(W,H), 1)) * 600;

      return {
        poly, cx, cy, dx, dy,
        speed,
        rotSpeed: (Math.random() - 0.5) * 8,
        /* slight delay for far pieces so shatter radiates outward */
        delay: Math.min(dist / Math.max(W,H), 1) * 0.12,
        /* random gold shade */
        hue: Math.random() > 0.5 ? `rgba(245,166,35,1)` : `rgba(200,120,10,1)`
      };
    }).filter(Boolean);

    const DURATION = 0.72; /* seconds total */
    let start = null;

    function frame(ts) {
      if (!start) start = ts;
      const elapsed = (ts - start) / 1000;
      const globalT = Math.min(elapsed / DURATION, 1);

      ctx.clearRect(0, 0, W, H);

      /* Dark background behind shards so no white flash */
      ctx.fillStyle = '#06060a';
      ctx.fillRect(0, 0, W, H);

      let allGone = true;

      cells.forEach(cell => {
        const t = Math.max(0, Math.min((elapsed - cell.delay) / (DURATION - cell.delay), 1));
        if (t < 1) allGone = false;

        /* Ease out cubic */
        const ease = 1 - Math.pow(1 - t, 3);

        const tx = cell.dx * cell.speed * ease;
        const ty = cell.dy * cell.speed * ease;
        const rot = cell.rotSpeed * ease;
        const alpha = 1 - Math.pow(t, 1.6);

        if (alpha <= 0) return;

        ctx.save();
        ctx.translate(cell.cx + tx, cell.cy + ty);
        ctx.rotate(rot);
        ctx.globalAlpha = alpha;

        /* Draw shard */
        ctx.beginPath();
        cell.poly.forEach((p, i) => {
          const lx = p.x - cell.cx;
          const ly = p.y - cell.cy;
          i === 0 ? ctx.moveTo(lx, ly) : ctx.lineTo(lx, ly);
        });
        ctx.closePath();

        /* Gold gradient fill */
        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, 120);
        grad.addColorStop(0, '#ffe066');
        grad.addColorStop(0.4, '#f5a623');
        grad.addColorStop(1, '#7a3e00');
        ctx.fillStyle = grad;
        ctx.fill();

        /* Gold edge glow */
        ctx.strokeStyle = `rgba(255,200,60,${alpha * 0.7})`;
        ctx.lineWidth = 1.2;
        ctx.stroke();

        ctx.restore();
      });

      if (globalT < 1) {
        requestAnimationFrame(frame);
      } else {
        /* Navigate immediately — portfolio.html has its own reveal,
           so there will be NO black gap */
        onDone();
      }
    }

    requestAnimationFrame(frame);
  }

  /* Enter button */
  document.getElementById('enterBtn').addEventListener('click', function(e) {
    e.preventDefault();
    const x = e.clientX, y = e.clientY;

    sessionStorage.setItem('transitionX', (x / window.innerWidth  * 100).toFixed(1));
    sessionStorage.setItem('transitionY', (y / window.innerHeight * 100).toFixed(1));

    /* Instantly hide the UI content — shatter canvas takes over */
    const inner = document.getElementById('welcome');
    inner.style.transition = 'opacity 0.15s ease';
    inner.style.opacity = '0';

    /* Small delay so the fade starts before shatter begins */
    setTimeout(() => {
      runShatter(x, y, () => {
        window.location.href = 'portfolio.html';
      });
    }, 80);
  });

})();
</script>

</body>
